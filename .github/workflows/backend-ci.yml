name: Backend production gate

on:
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main, "codex/**"]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked tooling
        run: |
          python -m pip install uv==0.8.22
          uv sync --frozen
      - name: Ruff formatting
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Strict mypy
        run: uv run mypy --strict ladle
      - name: Migration metadata consistency
        run: uv run pytest -q tests/integration/test_migrations.py
      - name: Non-live tests
        run: uv run pytest -q -m "not live_provider and not chaos"
      - name: Real PostgreSQL restore drill
        run: uv run python scripts/restore_drill.py
      - name: Dependency audit
        run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes \
            --output-file /tmp/ladle-requirements.txt
          uvx pip-audit -r /tmp/ladle-requirements.txt
      - name: Diff hygiene
        run: git diff --check

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks history scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build exact candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: Backend
          load: true
          platforms: linux/amd64
          tags: ladle-backend:${{ github.sha }}
      - name: Scan OS and Python packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ladle-backend:${{ github.sha }}
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
          vuln-type: os,library
      - name: Build Mac worker egress gateway
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: Backend/deploy/mac-mini
          file: Backend/deploy/mac-mini/egress.Dockerfile
          load: true
          platforms: linux/amd64
          tags: ladle-worker-egress:${{ github.sha }}
      - name: Build Mac ingress edge
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: Backend/deploy/mac-mini
          file: Backend/deploy/mac-mini/edge.Dockerfile
          load: true
          platforms: linux/amd64
          tags: ladle-mac-edge:${{ github.sha }}
      - name: Scan Mac worker egress gateway
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ladle-worker-egress:${{ github.sha }}
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
          vuln-type: os,library
      - name: Scan Mac ingress edge
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ladle-mac-edge:${{ github.sha }}
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
          vuln-type: os,library
      - name: Generate candidate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ladle-backend:${{ github.sha }}
          format: spdx-json
          output-file: ladle-backend-${{ github.sha }}.spdx.json
      - name: Generate Mac worker egress SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ladle-worker-egress:${{ github.sha }}
          format: spdx-json
          output-file: ladle-worker-egress-${{ github.sha }}.spdx.json
          upload-artifact: false
      - name: Generate Mac ingress edge SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ladle-mac-edge:${{ github.sha }}
          format: spdx-json
          output-file: ladle-mac-edge-${{ github.sha }}.spdx.json
          upload-artifact: false
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ladle-backend-sbom
          path: ladle-backend-${{ github.sha }}.spdx.json
      - name: Upload Mac infrastructure SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ladle-mac-infrastructure-sboms
          path: |
            ladle-worker-egress-${{ github.sha }}.spdx.json
            ladle-mac-edge-${{ github.sha }}.spdx.json
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact image with SBOM and provenance
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: Backend
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
      - name: Scan published production digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/backend@${{ steps.release.outputs.digest }}
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
          vuln-type: os,library
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Sign verified production digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/backend
          DIGEST: ${{ steps.release.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  load-and-chaos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked tooling
        run: |
          python -m pip install uv==0.8.22
          uv sync --frozen
      - name: Worker-kill and broker-outage recovery
        env:
          LADLE_RUN_CHAOS: "1"
        run: uv run pytest -q -m chaos
      - name: Capacity and graph limits
        run: |
          trap 'docker compose down --volumes --remove-orphans' EXIT
          docker compose up -d --build
          docker run --rm --network host -e BASE_URL=http://127.0.0.1:4112 \
            -v "$PWD/load:/load:ro" \
            grafana/k6@sha256:4fd3a694926b064d3491d9b02b01cde886583c4931f1223816e3d9a7bdfa7e0f \
            run /load/k6-production.js
