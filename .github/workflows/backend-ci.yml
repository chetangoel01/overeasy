name: Backend production gate

on:
  pull_request:
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  # Only main runs on push. Feature branches already run through their pull
  # request; listing them here too ran every codex/** commit twice.
  push:
    branches: [main]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-ci.yml"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# A newer commit on the same pull request supersedes the run in flight. Every
# other run (main pushes, the cron, dispatches) gets a group of its own, so a
# burst of merges never cancels a pending main run: each main commit must end
# with a published, signed image. A group holds one pending run at most, and a
# newer arrival drops it whatever cancel-in-progress says, so sharing a group
# across main runs is not safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The pytest step runs exactly what `uv run pytest` runs locally. It needs
  # nothing but a Docker daemon: every fixture that wants PostgreSQL, Redis or
  # object storage starts its own throwaway container through testcontainers.
  RUN_BACKEND_TESTS: "true"

jobs:
  quality:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked tooling
        run: |
          python -m pip install uv==0.8.22
          uv sync --frozen
      - name: Ruff formatting
        run: uv run ruff format --check .
      - name: Ruff lint
        run: uv run ruff check .
      - name: Strict mypy
        run: uv run mypy --strict ladle
      # One pytest run, because `addopts` already selects every tier except
      # the live-provider and chaos ones. It contains the migration metadata
      # check and the real pg_dump restore drill, which used to run again as
      # steps of their own.
      - name: Non-live tests
        if: env.RUN_BACKEND_TESTS == 'true'
        run: uv run pytest -q
      - name: Dependency audit
        run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes \
            --output-file /tmp/ladle-requirements.txt
          uvx pip-audit -r /tmp/ladle-requirements.txt
      - name: Diff hygiene
        run: git diff --check

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks history scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Required for pull_request events since gitleaks-action v2.3.0; without
          # it the scan hard-fails on every PR while still passing on push.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build exact candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: Backend
          load: true
          platforms: linux/amd64
          tags: ladle-backend:${{ github.sha }}
      - name: Scan OS and Python packages
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ladle-backend:${{ github.sha }}
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
          vuln-type: os,library
      - name: Build Mac worker egress gateway
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: Backend/deploy/mac-mini
          file: Backend/deploy/mac-mini/egress.Dockerfile
          load: true
          platforms: linux/amd64
          tags: ladle-worker-egress:${{ github.sha }}
      - name: Build Mac ingress edge
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: Backend/deploy/mac-mini
          file: Backend/deploy/mac-mini/edge.Dockerfile
          load: true
          platforms: linux/amd64
          tags: ladle-mac-edge:${{ github.sha }}
      - name: Scan Mac worker egress gateway
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ladle-worker-egress:${{ github.sha }}
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
          vuln-type: os,library
      - name: Scan Mac ingress edge
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ladle-mac-edge:${{ github.sha }}
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
          vuln-type: os,library
      - name: Generate candidate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ladle-backend:${{ github.sha }}
          format: spdx-json
          output-file: ladle-backend-${{ github.sha }}.spdx.json
      - name: Generate Mac worker egress SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ladle-worker-egress:${{ github.sha }}
          format: spdx-json
          output-file: ladle-worker-egress-${{ github.sha }}.spdx.json
          upload-artifact: false
      - name: Generate Mac ingress edge SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ladle-mac-edge:${{ github.sha }}
          format: spdx-json
          output-file: ladle-mac-edge-${{ github.sha }}.spdx.json
          upload-artifact: false
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ladle-backend-sbom
          path: ladle-backend-${{ github.sha }}.spdx.json
      - name: Upload Mac infrastructure SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ladle-mac-infrastructure-sboms
          path: |
            ladle-worker-egress-${{ github.sha }}.spdx.json
            ladle-mac-edge-${{ github.sha }}.spdx.json
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish exact image with SBOM and provenance
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: Backend
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
      - name: Scan published production digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/backend@${{ steps.release.outputs.digest }}
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: CRITICAL,HIGH
          vuln-type: os,library
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - name: Sign verified production digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/backend
          DIGEST: ${{ steps.release.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  load-and-chaos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install locked tooling
        run: |
          python -m pip install uv==0.8.22
          uv sync --frozen
      - name: Worker-kill and broker-outage recovery
        if: env.RUN_BACKEND_TESTS == 'true'
        env:
          LADLE_RUN_CHAOS: "1"
        run: uv run pytest -q -m chaos -n0
      - name: Capacity and graph limits
        # `up -d` returns once the containers exist, not once the API answers,
        # so k6's setup() used to reach a cold API and fail on a null body.
        # Compose's own --wait is out: the runner's 2.38.2 rejects beat's
        # disabled healthcheck ("has no healthcheck configured"). The API's
        # readiness covers the migrations, the broker, the worker's ping and
        # object storage, so k6 starts once that answers 200; a stack that
        # never gets there fails by name with the containers' state in the log
        # instead of a k6 threshold report.
        run: |
          finish() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose ps -a
              docker compose logs --no-color --tail 100 api worker
            fi
            docker compose down --volumes --remove-orphans
          }
          trap finish EXIT
          docker compose up -d --build
          for _ in $(seq 60); do
            code=$(curl -s -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:4112/health/ready || true)
            [ "$code" = 200 ] && break
            sleep 5
          done
          if [ "$code" != 200 ]; then
            echo "API not ready after 300 s; last answer: $code $(cat /tmp/ready.json 2>/dev/null)"
            exit 1
          fi
          docker run --rm --network host -e BASE_URL=http://127.0.0.1:4112 \
            -v "$PWD/load:/load:ro" \
            grafana/k6@sha256:4fd3a694926b064d3491d9b02b01cde886583c4931f1223816e3d9a7bdfa7e0f \
            run /load/k6-production.js
