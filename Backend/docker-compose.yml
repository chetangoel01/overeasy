services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ladle
      POSTGRES_USER: ladle
      POSTGRES_PASSWORD: ladle
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ladle -d ladle"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ladle-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ladle-redis:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ladle-local
      MINIO_ROOT_PASSWORD: ladle-local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ladle-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set ladle http://minio:9000 ladle-local ladle-local-secret &&
        mc mb --ignore-existing ladle/ladle-private
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    build: .
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    environment: &ladle-environment
      LADLE_ENVIRONMENT: development
      LADLE_JWT_SIGNING_SECRET: change-me-development-only
      LADLE_DATA_ENCRYPTION_KEY: change-me-development-only
      LADLE_DATABASE_URL: postgresql+psycopg://ladle:ladle@postgres:5432/ladle
      LADLE_CELERY_ENABLED: "true"
      LADLE_CELERY_BROKER_URL: redis://redis:6379/0
      LADLE_CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Provider settings substitute from Backend/.env; defaults keep the
      # stack in deterministic fake mode when no keys are present.
      LADLE_WORKER_PROVIDER_MODE: ${LADLE_WORKER_PROVIDER_MODE:-fake}
      LADLE_EXTRACTION_PROVIDER: ${LADLE_EXTRACTION_PROVIDER:-openrouter}
      LADLE_SUPADATA_API_KEY: ${LADLE_SUPADATA_API_KEY:-}
      LADLE_SOSCRIPTED_API_KEY: ${LADLE_SOSCRIPTED_API_KEY:-}
      LADLE_OPENROUTER_API_KEY: ${LADLE_OPENROUTER_API_KEY:-}
      LADLE_OPENROUTER_MODEL_ID: ${LADLE_OPENROUTER_MODEL_ID:-moonshotai/kimi-k2.5}
      LADLE_OBJECT_STORAGE_ENABLED: "true"
      LADLE_OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      LADLE_OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: http://minio.ladle.localhost
      LADLE_OBJECT_STORAGE_REGION: us-east-1
      LADLE_OBJECT_STORAGE_BUCKET: ladle-private
      LADLE_OBJECT_STORAGE_ACCESS_KEY: ladle-local
      LADLE_OBJECT_STORAGE_SECRET_KEY: ladle-local-secret
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment: *ladle-environment
    ports:
      - "127.0.0.1:4112:4111"
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4111/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build: .
    command:
      [
        "/app/.venv/bin/celery",
        "-A",
        "ladle.worker.app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=2",
      ]
    environment: *ladle-environment
    volumes:
      # scripts/eval_extraction.py runs in here for database access but writes
      # cached video contexts and scoreboards a human reads. Bound so they
      # outlive the container and land straight on the host.
      - ./.eval-cache:/app/.eval-cache
    healthcheck:
      test:
        [
          "CMD",
          "/app/.venv/bin/celery",
          "-A",
          "ladle.worker.app:celery_app",
          "inspect",
          "ping",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Sole scheduler. Kept out of the worker (no `--beat`) so that raising the
  # worker's concurrency or replica count cannot start a second beat and run
  # every sweep twice.
  beat:
    build: .
    command:
      [
        "/app/.venv/bin/celery",
        "-A",
        "ladle.worker.app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    environment: *ladle-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  ladle-minio:
  ladle-postgres:
  ladle-redis:
