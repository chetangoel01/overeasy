[project]
name = "ladle-backend"
version = "0.1.0"
description = "Production API and worker runtime for Ladle."
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.6.3,<5.7",
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
markers = [
    "integration: exercises real infrastructure and may be slower",
    "live_provider: calls an explicitly configured live external provider",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.wheel]
packages = ["ladle"]

[[tool.mypy.overrides]]
module = "celery.*"
ignore_missing_imports = true
