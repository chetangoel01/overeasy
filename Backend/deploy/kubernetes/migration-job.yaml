apiVersion: batch/v1
kind: Job
metadata:
  name: ladle-migrate
  labels:
    app.kubernetes.io/name: ladle
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ladle
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          # Deployment automation must replace this with the exact API/worker
          # image digest before applying the Job.
          image: ladle-backend:release
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: ladle-runtime
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
