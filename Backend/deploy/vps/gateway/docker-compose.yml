services:
  gateway:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      LADLE_PUBLIC_HOSTNAME: ${LADLE_PUBLIC_HOSTNAME:?set LADLE_PUBLIC_HOSTNAME}
      LADLE_TUNNEL_ACCESS_KEY: ${LADLE_TUNNEL_ACCESS_KEY:?set LADLE_TUNNEL_ACCESS_KEY}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./routes:/etc/caddy/routes:ro
      - gateway-caddy-data:/data
      - gateway-caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - platform-edge

volumes:
  gateway-caddy-data:
  gateway-caddy-config:

networks:
  platform-edge:
    external: true
