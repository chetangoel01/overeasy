x-testing-healthcheck: &testing-healthcheck
  interval: 5m
  retries: 3
  start_period: 1m
  start_interval: 5s

x-ladle-environment: &ladle-environment
  LADLE_ENVIRONMENT: ${LADLE_ENVIRONMENT:-production}
  LADLE_INTERACTIVE_DOCS_ENABLED: ${LADLE_INTERACTIVE_DOCS_ENABLED:-false}
  LADLE_JWT_SIGNING_SECRET: ${LADLE_JWT_SIGNING_SECRET:?set LADLE_JWT_SIGNING_SECRET}
  LADLE_DATA_ENCRYPTION_KEY: ${LADLE_DATA_ENCRYPTION_KEY:?set LADLE_DATA_ENCRYPTION_KEY}
  LADLE_DATA_ENCRYPTION_ACTIVE_KEY_ID: ${LADLE_DATA_ENCRYPTION_ACTIVE_KEY_ID:?set LADLE_DATA_ENCRYPTION_ACTIVE_KEY_ID}
  LADLE_DATA_ENCRYPTION_KEYRING: ${LADLE_DATA_ENCRYPTION_KEYRING:?set LADLE_DATA_ENCRYPTION_KEYRING}
  LADLE_DATABASE_URL: postgresql+psycopg://ladle:${LADLE_DATABASE_PASSWORD}@postgres:5432/ladle
  LADLE_CELERY_ENABLED: "true"
  LADLE_CELERY_BROKER_URL: redis://:${LADLE_REDIS_PASSWORD}@redis:6379/0
  LADLE_CELERY_RESULT_BACKEND: redis://:${LADLE_REDIS_PASSWORD}@redis:6379/1
  LADLE_RATE_LIMITING_ENABLED: "true"
  LADLE_RATE_LIMIT_REDIS_URL: redis://:${LADLE_REDIS_PASSWORD}@redis:6379/2
  LADLE_RATE_LIMIT_TRUSTED_PROXY_CIDRS: ${LADLE_RATE_LIMIT_TRUSTED_PROXY_CIDRS:?set LADLE_RATE_LIMIT_TRUSTED_PROXY_CIDRS}
  LADLE_DURABLE_METRICS_ENABLED: "true"
  LADLE_METRICS_REDIS_URL: redis://:${LADLE_REDIS_PASSWORD}@redis:6379/3
  LADLE_METRICS_AUTH_TOKEN: ${LADLE_METRICS_AUTH_TOKEN:?set LADLE_METRICS_AUTH_TOKEN}
  LADLE_OPS_DASHBOARD_TOKEN: ${LADLE_OPS_DASHBOARD_TOKEN:?set LADLE_OPS_DASHBOARD_TOKEN}
  LADLE_WORKER_PROVIDER_MODE: live
  LADLE_EXTRACTION_PROVIDER: ${LADLE_EXTRACTION_PROVIDER:-openrouter}
  LADLE_OPENROUTER_API_KEY: ${LADLE_OPENROUTER_API_KEY:-}
  LADLE_USDA_NUTRITION_ENABLED: "true"
  LADLE_USDA_API_KEY: ${LADLE_USDA_API_KEY:?set LADLE_USDA_API_KEY}
  LADLE_ANTHROPIC_API_KEY: ${LADLE_ANTHROPIC_API_KEY:-}
  LADLE_SUPADATA_API_KEY: ${LADLE_SUPADATA_API_KEY:-}
  LADLE_SOSCRIPTED_API_KEY: ${LADLE_SOSCRIPTED_API_KEY:-}
  LADLE_AUDIO_TRANSCRIPTION_ENABLED: ${LADLE_AUDIO_TRANSCRIPTION_ENABLED:-true}
  LADLE_FRAME_ANALYSIS_ENABLED: "false"
  LADLE_THUMBNAIL_ANALYSIS_ENABLED: "false"
  LADLE_SERVER_MEDIA_FALLBACK_ENABLED: "false"
  LADLE_OBJECT_STORAGE_ENABLED: "true"
  LADLE_OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
  LADLE_OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: https://${LADLE_PUBLIC_HOSTNAME:?set LADLE_PUBLIC_HOSTNAME}
  LADLE_OBJECT_STORAGE_REGION: us-east-1
  LADLE_OBJECT_STORAGE_BUCKET: ladle-private
  LADLE_OBJECT_STORAGE_ADDRESSING_STYLE: path
  LADLE_OBJECT_STORAGE_ACCESS_KEY: ${LADLE_OBJECT_STORAGE_ACCESS_KEY:?set LADLE_OBJECT_STORAGE_ACCESS_KEY}
  LADLE_OBJECT_STORAGE_SECRET_KEY: ${LADLE_OBJECT_STORAGE_SECRET_KEY:?set LADLE_OBJECT_STORAGE_SECRET_KEY}
  LADLE_ATTESTATION_ENFORCED: ${LADLE_ATTESTATION_ENFORCED:-true}
  LADLE_APP_ATTEST_APP_ID_PREFIX: ${LADLE_APP_ATTEST_APP_ID_PREFIX:?set LADLE_APP_ATTEST_APP_ID_PREFIX}
  LADLE_APP_ATTEST_BUNDLE_ID: ${LADLE_APP_ATTEST_BUNDLE_ID:-com.ladle.ios}
  LADLE_APP_ATTEST_ENVIRONMENT: ${LADLE_APP_ATTEST_ENVIRONMENT:-production}
  LADLE_APPLE_ENABLED: "true"
  LADLE_APPLE_BUNDLE_ID: ${LADLE_APPLE_BUNDLE_ID:-com.ladle.ios}
  LADLE_APPLE_TEAM_ID: ${LADLE_APPLE_TEAM_ID:?set LADLE_APPLE_TEAM_ID}
  LADLE_APPLE_KEY_ID: ${LADLE_APPLE_KEY_ID:?set LADLE_APPLE_KEY_ID}
  LADLE_APPLE_PRIVATE_KEY_FILE: /run/secrets/apple_private_key
  LADLE_GOOGLE_ENABLED: "true"
  LADLE_GOOGLE_SERVER_CLIENT_ID: ${LADLE_GOOGLE_SERVER_CLIENT_ID:?set LADLE_GOOGLE_SERVER_CLIENT_ID}
  LADLE_STRUCTURED_LOGGING_ENABLED: "true"
  LADLE_TRACING_ENABLED: "false"

x-app: &app
  build:
    context: .
    args:
      INSTALL_MEDIA_TOOLS: "true"
  environment: *ladle-environment
  secrets:
    - apple_private_key
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ladle
      POSTGRES_USER: ladle
      POSTGRES_PASSWORD: ${LADLE_DATABASE_PASSWORD:?set LADLE_DATABASE_PASSWORD}
    healthcheck:
      <<: *testing-healthcheck
      test: ["CMD-SHELL", "pg_isready -U ladle -d ladle"]
      timeout: 5s
    volumes:
      - postgres:/var/lib/postgresql/data
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${LADLE_REDIS_PASSWORD:?set LADLE_REDIS_PASSWORD}
    command:
      - sh
      - -c
      - >-
        exec redis-server --appendonly yes --appendfsync everysec
        --maxmemory 192mb --maxmemory-policy noeviction
        --requirepass "$${REDIS_PASSWORD}"
    healthcheck:
      <<: *testing-healthcheck
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping"]
      timeout: 5s
    volumes:
      - redis:/data
    mem_limit: 256m

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${LADLE_OBJECT_STORAGE_ACCESS_KEY:?set LADLE_OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${LADLE_OBJECT_STORAGE_SECRET_KEY:?set LADLE_OBJECT_STORAGE_SECRET_KEY}
    healthcheck:
      <<: *testing-healthcheck
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      timeout: 5s
    volumes:
      - minio:/data
    networks:
      default: {}
      platform:
        aliases: [ladle-minio]
    mem_limit: 512m

  minio-init:
    <<: *app
    restart: "no"
    command: ["/app/.venv/bin/python", "-m", "ladle.infrastructure.object_storage_init"]
    environment:
      LADLE_OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      LADLE_OBJECT_STORAGE_REGION: us-east-1
      LADLE_OBJECT_STORAGE_BUCKET: ladle-private
      LADLE_OBJECT_STORAGE_ADDRESSING_STYLE: path
      LADLE_OBJECT_STORAGE_ACCESS_KEY: ${LADLE_OBJECT_STORAGE_ACCESS_KEY:?set LADLE_OBJECT_STORAGE_ACCESS_KEY}
      LADLE_OBJECT_STORAGE_SECRET_KEY: ${LADLE_OBJECT_STORAGE_SECRET_KEY:?set LADLE_OBJECT_STORAGE_SECRET_KEY}
      LADLE_OBJECT_STORAGE_LIFECYCLE_PATH: /app/deploy/object-storage-lifecycle.json
    secrets: []
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    <<: *app
    restart: "no"
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command:
      - /app/.venv/bin/uvicorn
      - ladle.api.app:app
      - --host=0.0.0.0
      - --port=4111
      - --workers
      - "2"
      - --proxy-headers
      # The /ops token arrives once in a query string, and this command runs
      # uvicorn directly, so ladle/api/__main__.py never gets to disable it.
      - --no-access-log
    healthcheck:
      <<: *testing-healthcheck
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:4111/health/live', timeout=3)
      timeout: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      default: {}
      platform:
        aliases: [ladle-api]
    mem_limit: 1g

  worker:
    <<: *app
    command:
      - /app/.venv/bin/celery
      - -A
      - ladle.worker.app:celery_app
      - worker
      - --beat
      - --schedule=/tmp/celerybeat-schedule
      - --loglevel=INFO
      - --concurrency=4
    healthcheck:
      <<: *testing-healthcheck
      # `celery inspect ping` cost about eleven seconds a run: it spawns a CLI
      # process that imports the whole application before it can ask the worker
      # anything, and it was timing out against its own 10s budget while
      # answering OK. Celery's heartbeat already touches this file, so the same
      # liveness is one stat call away. /tmp is tmpfs above, which is what makes
      # it writable under read_only: true.
      test:
        - CMD-SHELL
        - test -f /tmp/worker-heartbeat && [ $(( $(date +%s) - $(stat -c %Y /tmp/worker-heartbeat) )) -lt 300 ]
      timeout: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 2g

volumes:
  postgres:
    name: ladle_ladle-postgres
  redis:
    name: ladle_ladle-redis
  minio:
    name: ladle_ladle-minio

networks:
  default: {}
  platform:
    external: true
    name: platform-edge

secrets:
  apple_private_key:
    file: ${LADLE_APPLE_PRIVATE_KEY_PATH:?set LADLE_APPLE_PRIVATE_KEY_PATH}
