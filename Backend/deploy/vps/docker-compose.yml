x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: 3

x-vps-runtime-build: &vps-runtime-build
  context: .
  args:
    INSTALL_MEDIA_TOOLS: "false"

x-vps-environment: &vps-environment
  LADLE_ENVIRONMENT: "development"
  LADLE_JWT_SIGNING_SECRET: ${LADLE_JWT_SIGNING_SECRET:?set LADLE_JWT_SIGNING_SECRET}
  LADLE_DATA_ENCRYPTION_KEY: ${LADLE_DATA_ENCRYPTION_KEY:?set LADLE_DATA_ENCRYPTION_KEY}
  # This must be the percent-encoded form of the raw POSTGRES_PASSWORD value.
  LADLE_DATABASE_URL: postgresql+psycopg://ladle:${LADLE_DATABASE_PASSWORD_URL_ENCODED:?set LADLE_DATABASE_PASSWORD_URL_ENCODED}@postgres:5432/ladle
  LADLE_CELERY_ENABLED: "true"
  LADLE_CELERY_BROKER_URL: redis://redis:6379/0
  LADLE_CELERY_RESULT_BACKEND: redis://redis:6379/1
  LADLE_DURABLE_METRICS_ENABLED: "true"
  LADLE_METRICS_REDIS_URL: redis://redis:6379/3
  LADLE_METRICS_AUTH_TOKEN: ${LADLE_METRICS_AUTH_TOKEN:?set LADLE_METRICS_AUTH_TOKEN}
  LADLE_RATE_LIMITING_ENABLED: "true"
  LADLE_RATE_LIMIT_REDIS_URL: redis://redis:6379/2
  LADLE_RATE_LIMIT_TRUSTED_PROXY_CIDRS: 172.31.0.3/32
  LADLE_OBJECT_STORAGE_ENABLED: "true"
  LADLE_OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
  LADLE_OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: https://${LADLE_PUBLIC_HOSTNAME}
  LADLE_OBJECT_STORAGE_REGION: us-east-1
  LADLE_OBJECT_STORAGE_BUCKET: ladle-private
  LADLE_OBJECT_STORAGE_ADDRESSING_STYLE: path
  LADLE_OBJECT_STORAGE_ACCESS_KEY: ${LADLE_OBJECT_STORAGE_ACCESS_KEY:?set LADLE_OBJECT_STORAGE_ACCESS_KEY}
  LADLE_OBJECT_STORAGE_SECRET_KEY: ${LADLE_OBJECT_STORAGE_SECRET_KEY:?set LADLE_OBJECT_STORAGE_SECRET_KEY}
  LADLE_AUDIO_TRANSCRIPTION_ENABLED: "false"
  LADLE_FRAME_ANALYSIS_ENABLED: "false"
  LADLE_SERVER_MEDIA_FALLBACK_ENABLED: "false"

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_DB: ladle
      POSTGRES_USER: ladle
      POSTGRES_PASSWORD: ${LADLE_DATABASE_PASSWORD:?set LADLE_DATABASE_PASSWORD}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=0775,uid=70,gid=70
    cap_drop:
      - "ALL"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging: *bounded-logging
    volumes:
      - ladle-postgres:/var/lib/postgresql/data

  redis:
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1"
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
      - --stop-writes-on-bgsave-error
      - "yes"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - "ALL"
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
    logging: *bounded-logging
    volumes:
      - ladle-redis:/data

  minio:
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${LADLE_OBJECT_STORAGE_ACCESS_KEY:?set LADLE_OBJECT_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${LADLE_OBJECT_STORAGE_SECRET_KEY:?set LADLE_OBJECT_STORAGE_SECRET_KEY}
    ports: !reset []
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    logging: *bounded-logging
    volumes:
      - ladle-minio:/data
    networks:
      default: {}
      edge:
        ipv4_address: 172.31.0.5

  minio-init:
    build: *vps-runtime-build
    restart: "no"
    environment:
      LADLE_OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      LADLE_OBJECT_STORAGE_REGION: us-east-1
      LADLE_OBJECT_STORAGE_BUCKET: ladle-private
      LADLE_OBJECT_STORAGE_ADDRESSING_STYLE: path
      LADLE_OBJECT_STORAGE_ACCESS_KEY: ${LADLE_OBJECT_STORAGE_ACCESS_KEY:?set LADLE_OBJECT_STORAGE_ACCESS_KEY}
      LADLE_OBJECT_STORAGE_SECRET_KEY: ${LADLE_OBJECT_STORAGE_SECRET_KEY:?set LADLE_OBJECT_STORAGE_SECRET_KEY}
      LADLE_OBJECT_STORAGE_LIFECYCLE_PATH: /app/deploy/object-storage-lifecycle.json
    volumes: !reset []
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.5
    logging: *bounded-logging

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    environment:
      LADLE_PUBLIC_HOSTNAME: ${LADLE_PUBLIC_HOSTNAME:?set LADLE_PUBLIC_HOSTNAME}
      LADLE_TUNNEL_ACCESS_KEY: ${LADLE_TUNNEL_ACCESS_KEY:?set LADLE_TUNNEL_ACCESS_KEY}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - "ALL"
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    logging: *bounded-logging
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - ladle-caddy-data:/data
      - ladle-caddy-config:/config
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      edge:
        condition: service_healthy
    networks:
      public: {}
      edge:
        ipv4_address: 172.31.0.2

  edge:
    build:
      context: ./deploy/mac-mini
      dockerfile: edge.Dockerfile
    restart: unless-stopped
    ports: !reset []
    read_only: true
    user: "101:101"
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.25
    logging: *bounded-logging
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.31.0.3

  migrate:
    build: *vps-runtime-build
    restart: "no"
    environment: *vps-environment
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    logging: *bounded-logging

  api:
    build: *vps-runtime-build
    restart: unless-stopped
    environment: *vps-environment
    ports: !reset []
    pids_limit: 512
    mem_limit: 1g
    cpus: 1.5
    logging: *bounded-logging
    networks:
      default: {}
      edge:
        ipv4_address: 172.31.0.4

  worker-egress:
    build:
      context: ./deploy/mac-mini
      dockerfile: egress.Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop:
      - "ALL"
    cap_add:
      - NET_ADMIN
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.1
    logging: *bounded-logging
    environment:
      WORKER_UID: "10001"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      MINIO_HOST: minio
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - >-
          test -f /tmp/egress-ready &&
          iptables -C OUTPUT -m owner --uid-owner 10001
          -j LADLE_WORKER_EGRESS
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build: *vps-runtime-build
    restart: unless-stopped
    environment: *vps-environment
    network_mode: service:worker-egress
    volumes: !reset []
    pids_limit: 512
    mem_limit: 1536m
    cpus: 2.0
    logging: *bounded-logging
    depends_on:
      worker-egress:
        condition: service_healthy

  beat:
    build: *vps-runtime-build
    restart: unless-stopped
    environment: *vps-environment
    pids_limit: 128
    mem_limit: 384m
    cpus: 0.5
    logging: *bounded-logging

volumes:
  ladle-postgres:
  ladle-redis:
  ladle-minio:
  ladle-caddy-data:
  ladle-caddy-config:

networks:
  default: {}
  public: {}
  edge:
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24
