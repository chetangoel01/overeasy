pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr notice;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client-body;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    scgi_temp_path /tmp/scgi;
    uwsgi_temp_path /tmp/uwsgi;
    client_max_body_size 1m;
    client_body_buffer_size 128k;
    server_tokens off;

    upstream ladle_api {
        server api:4111;
        keepalive 16;
    }

    upstream ladle_thumbnails {
        server minio:9000;
        keepalive 8;
    }

    server {
        listen 8080 proxy_protocol;
        set_real_ip_from 0.0.0.0/0;
        real_ip_header proxy_protocol;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        location = /openapi.json {
            return 404;
        }
        location = /docs {
            return 404;
        }
        location = /redoc {
            return 404;
        }
        location = /metrics {
            return 404;
        }

        error_page 413 = @request_too_large;
        location @request_too_large {
            internal;
            default_type application/json;
            return 413 '{"error":{"code":"invalidRequest","message":"Request body exceeds the 1 MiB limit."}}';
        }

        location / {
            proxy_pass http://ladle_api;
            proxy_http_version 1.1;
            proxy_request_buffering on;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $http_x_request_id;
        }
    }

    server {
        listen 8081;

        error_page 413 = @local_request_too_large;
        location @local_request_too_large {
            internal;
            default_type application/json;
            return 413 '{"error":{"code":"invalidRequest","message":"Request body exceeds the 1 MiB limit."}}';
        }

        location / {
            proxy_pass http://ladle_api;
            proxy_http_version 1.1;
            proxy_request_buffering on;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Request-ID $http_x_request_id;
        }
    }

    server {
        listen 8082;

        location /ladle-private/ {
            proxy_pass http://ladle_thumbnails;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location = /openapi.json {
            return 404;
        }
        location = /docs {
            return 404;
        }
        location = /redoc {
            return 404;
        }
        location = /metrics {
            return 404;
        }

        error_page 413 = @tunnel_request_too_large;
        location @tunnel_request_too_large {
            internal;
            default_type application/json;
            return 413 '{"error":{"code":"invalidRequest","message":"Request body exceeds the 1 MiB limit."}}';
        }

        location / {
            proxy_pass http://ladle_api;
            proxy_http_version 1.1;
            proxy_request_buffering on;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Ladle-Tunnel-Key "";
            proxy_set_header ngrok-skip-browser-warning "";
            proxy_set_header X-Request-ID $http_x_request_id;
        }
    }
}
