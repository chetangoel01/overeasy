x-chaos-timing: &chaos-timing
  LADLE_ANTHROPIC_TIMEOUT_SECONDS: "10"
  LADLE_CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: "12"
  LADLE_CELERY_TASK_TIME_LIMIT_SECONDS: "15"
  LADLE_CELERY_VISIBILITY_TIMEOUT_SECONDS: "20"
  LADLE_EXTRACTION_CLAIM_HEARTBEAT_SECONDS: "10"
  LADLE_EXTRACTION_CLAIM_MINUTES: "1"
  LADLE_FRAME_ANALYSIS_TIMEOUT_SECONDS: "10"
  LADLE_IMPORT_MAINTENANCE_INTERVAL_SECONDS: "5"
  LADLE_IMPORT_STALE_AFTER_MINUTES: "1"
  LADLE_LINKED_PAGE_TIMEOUT_SECONDS: "10"
  LADLE_OPENROUTER_TIMEOUT_SECONDS: "10"
  LADLE_SOSCRIPTED_TIMEOUT_SECONDS: "10"
  LADLE_SUPADATA_TIMEOUT_SECONDS: "10"
  LADLE_TRANSCRIPTION_TIMEOUT_SECONDS: "10"
  LADLE_YTDLP_TIMEOUT_SECONDS: "10"

services:
  api:
    environment: *chaos-timing
    ports: !override
      - "127.0.0.1:42112:4111"
  beat:
    environment: *chaos-timing
  minio:
    ports: !override []
  worker:
    environment: *chaos-timing
